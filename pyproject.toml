[project]
name = "ai-stock"
version = "0.1.0"
description = "Typed market-data retrieval, normalization, and arbitrage analysis."
readme = "README.md"
license = "MIT"
authors = [
  { name = "Soumyadeep Chakravrti", email = "soumyadeepsai1@gmail.com" },
]
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.39.10",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
]

[tool.ruff]
exclude = ["AI-Stock-Backup"]

[tool.basedpyright]
exclude = ["AI-Stock-Backup"]
venvPath = "."
venv = ".venv"
include = ["src"]
extraPaths = ["src"]
[[tool.basedpyright.executionEnvironments]]
root = "src"
