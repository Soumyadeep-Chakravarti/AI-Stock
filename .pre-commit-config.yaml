repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: Ruff format
        entry: uv run ruff format .
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-check
        name: Ruff check
        entry: uv run ruff check .
        language: system
        pass_filenames: false
        always_run: true
      - id: basedpyright
        name: Basedpyright
        entry: uv run basedpyright
        language: system
        pass_filenames: false
        always_run: true
      - id: pytest
        name: Pytest
        entry: uv run pytest -v
        language: system
        pass_filenames: false
        always_run: true
