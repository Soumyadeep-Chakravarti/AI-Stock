---
name: Release

"on":
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31

      - uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: ${{ runner.os }}-uv-

      - name: Sync Python dependencies
        run: nix develop ./.nix -c uv sync --locked

      - name: Verify release version
        run: |
          version="$(
            nix develop ./.nix -c python -c '
          import tomllib
          with open("pyproject.toml", "rb") as file:
              print(tomllib.load(file)["project"]["version"])
          '
          )"
          test "v${version}" = "${GITHUB_REF_NAME}"

      - name: Run quality gate
        run: nix develop ./.nix -c just check

      - name: Audit dependencies
        run: nix develop ./.nix -c just audit

      - name: Build distributions
        run: nix develop ./.nix -c uv build --out-dir dist

      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*
